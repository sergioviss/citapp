# =============================================================================
# Configuración de Tema del Template Customizer
# Este archivo se genera/actualiza automáticamente desde el panel de customización.
# Se commitea a git para que la configuración viaje con el proyecto.
# =============================================================================
theme:
  preset: default
  custom_colors:
    primary: "#4361ee"
    secondary: "#805dca"
    success: "#00ab55"
    danger: "#e7515a"
    warning: "#e2a03f"
    info: "#2196f3"
layout:
  scheme: light
  menu: vertical
  style: full
  direction: ltr
  animation: animate__fadeIn
  navbar: navbar-sticky
  semidark: true
logo:
  text: Template Base
  image: cuatropuntocero_logo.png
  show_image: false
  show_text: true
